services:
  # ============================================================================
  # Infrastructure Services (Docker internal only)
  # ============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: swiftlog_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swiftlog}
      POSTGRES_USER: ${POSTGRES_USER:-swiftlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftlog"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - swiftlog

  loki:
    image: grafana/loki:2.9.0
    container_name: swiftlog_loki
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - loki_data:/loki
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swiftlog

  redis:
    image: redis:7-alpine
    container_name: swiftlog_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - swiftlog

  # ============================================================================
  # Reverse Proxy (Unified Entry Point)
  # ============================================================================

  nginx:
    image: nginx:alpine
    container_name: swiftlog_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
      - websocket
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - swiftlog

  # ============================================================================
  # Backend Services
  # ============================================================================

  ingestor:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ingestor
    container_name: swiftlog_ingestor
    ports:
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
    environment:
      # Database connection (built from individual components)
      POSTGRES_USER: ${POSTGRES_USER:-swiftlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-swiftlog}
      POSTGRES_SSLMODE: disable
      # Docker internal addresses (hardcoded - no env vars needed)
      LOKI_URL: http://loki:3100
      REDIS_URL: redis://redis:6379
      GRPC_PORT: "${GRPC_PORT:-50051}"
      # Config from .env
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - swiftlog

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    container_name: swiftlog_api
    environment:
      # Database connection (built from individual components)
      POSTGRES_USER: ${POSTGRES_USER:-swiftlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-swiftlog}
      POSTGRES_SSLMODE: disable
      # Docker internal addresses (hardcoded)
      LOKI_URL: http://loki:3100
      REDIS_URL: redis://redis:6379
      API_PORT: "${API_PORT:-8080}"
      # Config from .env
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-2h}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - swiftlog

  websocket:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: websocket
    container_name: swiftlog_websocket
    environment:
      # Database connection (built from individual components)
      POSTGRES_USER: ${POSTGRES_USER:-swiftlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-swiftlog}
      POSTGRES_SSLMODE: disable
      # Docker internal addresses (hardcoded)
      REDIS_URL: redis://redis:6379
      WS_PORT: "${WS_PORT:-8081}"
      # Config from .env
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-2h}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - swiftlog

  ai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ai-worker
    container_name: swiftlog_ai_worker
    environment:
      # Database connection (built from individual components)
      POSTGRES_USER: ${POSTGRES_USER:-swiftlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-swiftlog}
      POSTGRES_SSLMODE: disable
      # Docker internal addresses (hardcoded)
      LOKI_URL: http://loki:3100
      REDIS_URL: redis://redis:6379
      # Config from .env
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - swiftlog

  # ============================================================================
  # Frontend Service
  # ============================================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Use relative paths for production (through nginx proxy)
        # Frontend is served through nginx which proxies /api/v1 and /ws
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_WS_BASE_URL: ""
    container_name: swiftlog_frontend
    environment:
      NODE_ENV: production
    depends_on:
      - api
      - websocket
    restart: unless-stopped
    networks:
      - swiftlog

# ============================================================================
# Networks & Volumes
# ============================================================================

networks:
  swiftlog:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  postgres_data:
    driver: local
  loki_data:
    driver: local
  redis_data:
    driver: local
