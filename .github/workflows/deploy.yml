name: Deploy

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Prepare deployment
        run: |
          mkdir -p deploy/nginx
          cp docker-compose.yaml deploy/
          cp loki-config.yaml deploy/
          cp .env.example deploy/.env
          cp nginx/nginx.conf deploy/nginx/

          cat > deploy/update-env.sh << 'EOF'
          #!/bin/bash
          set -e
          ENV_FILE="${1:-.env}"
          update_env() {
            [ -z "$2" ] && return
            if grep -q "^$1=" "$ENV_FILE"; then
              sed -i.bak "s|^$1=.*|$1=$2|" "$ENV_FILE"
            else
              echo "$1=$2" >> "$ENV_FILE"
            fi
          }
          [ -n "$PUBLIC_URL" ] && update_env "PUBLIC_URL" "$PUBLIC_URL"
          [ -n "$NGINX_PORT" ] && update_env "NGINX_PORT" "$NGINX_PORT"
          [ -n "$POSTGRES_PASSWORD" ] && update_env "POSTGRES_PASSWORD" "$POSTGRES_PASSWORD"
          [ -n "$JWT_SECRET" ] && update_env "JWT_SECRET" "$JWT_SECRET"
          [ -n "$ENCRYPTION_KEY" ] && update_env "ENCRYPTION_KEY" "$ENCRYPTION_KEY"
          [ -n "$ADMIN_USERNAME" ] && update_env "ADMIN_USERNAME" "$ADMIN_USERNAME"
          [ -n "$ADMIN_PASSWORD" ] && update_env "ADMIN_PASSWORD" "$ADMIN_PASSWORD"
          [ -n "$ENVIRONMENT" ] && update_env "ENVIRONMENT" "$ENVIRONMENT"
          [ -n "$LOG_LEVEL" ] && update_env "LOG_LEVEL" "$LOG_LEVEL"
          [ -n "$CORS_ORIGINS" ] && update_env "CORS_ORIGINS" "$CORS_ORIGINS"
          rm -f "${ENV_FILE}.bak"
          EOF

          cat > deploy/update.sh << 'EOF'
          #!/bin/bash
          set -e
          docker compose pull
          docker compose down
          docker compose up -d --remove-orphans
          sleep 20
          docker compose ps
          EOF

          chmod +x deploy/*.sh

      - name: Update docker-compose
        run: |
          cd deploy
          VERSION=${{ steps.version.outputs.version }}
          # Comment out build sections and add image lines
          sed -i 's/^    build:$/    #build:/' docker-compose.yaml
          sed -i 's/^      context:/      #context:/' docker-compose.yaml
          sed -i 's/^      dockerfile:/      #dockerfile:/' docker-compose.yaml
          sed -i 's/^      target:/      #target:/' docker-compose.yaml
          sed -i '/container_name: swiftlog_ingestor/a\    image: ghcr.io/${{ github.repository }}/ingestor:'"${VERSION}" docker-compose.yaml
          sed -i '/container_name: swiftlog_api/a\    image: ghcr.io/${{ github.repository }}/api:'"${VERSION}" docker-compose.yaml
          sed -i '/container_name: swiftlog_websocket/a\    image: ghcr.io/${{ github.repository }}/websocket:'"${VERSION}" docker-compose.yaml
          sed -i '/container_name: swiftlog_ai_worker/a\    image: ghcr.io/${{ github.repository }}/ai-worker:'"${VERSION}" docker-compose.yaml
          sed -i '/container_name: swiftlog_frontend/a\    image: ghcr.io/${{ github.repository }}/frontend:'"${VERSION}" docker-compose.yaml

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy"
          target: "/tmp/"

      - uses: appleboy/ssh-action@v1.0.3
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          NGINX_PORT: ${{ secrets.NGINX_PORT || '80' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ENVIRONMENT: production
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'info' }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: PUBLIC_URL,NGINX_PORT,POSTGRES_PASSWORD,JWT_SECRET,ENCRYPTION_KEY,ADMIN_USERNAME,ADMIN_PASSWORD,ENVIRONMENT,LOG_LEVEL,CORS_ORIGINS
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/opt/swiftlog' }}"
            sudo mkdir -p $DEPLOY_DIR
            [ -f $DEPLOY_DIR/.env ] && sudo cp $DEPLOY_DIR/.env /tmp/.env.backup
            sudo cp -r /tmp/deploy/* $DEPLOY_DIR/
            [ -f /tmp/.env.backup ] && sudo cp /tmp/.env.backup $DEPLOY_DIR/.env || sudo cp /tmp/deploy/.env $DEPLOY_DIR/.env
            sudo chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} $DEPLOY_DIR
            cd $DEPLOY_DIR
            export PUBLIC_URL NGINX_PORT POSTGRES_PASSWORD JWT_SECRET ENCRYPTION_KEY ADMIN_USERNAME ADMIN_PASSWORD ENVIRONMENT LOG_LEVEL CORS_ORIGINS
            ./update-env.sh .env
            [ -z "$POSTGRES_PASSWORD" ] && exit 1
            [ -z "$JWT_SECRET" ] && exit 1
            [ -z "$ENCRYPTION_KEY" ] && exit 1
            [ -z "$CORS_ORIGINS" ] && [ -n "$PUBLIC_URL" ] && export CORS_ORIGINS="$PUBLIC_URL" && ./update-env.sh .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            ./update.sh ${{ steps.version.outputs.version }}
            docker logout ghcr.io
            rm -rf /tmp/deploy /tmp/.env.backup

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/swiftlog' }}
            NGINX_PORT=$(grep -E '^NGINX_PORT=' .env | cut -d'=' -f2 || echo "80")
            curl -f http://localhost:${NGINX_PORT}/health || exit 1
