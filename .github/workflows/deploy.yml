name: Deploy

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            # Remove 'v' prefix from tag for Docker image tag
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Prepare deployment
        run: |
          mkdir -p deploy/nginx
          cp docker-compose.yaml deploy/
          cp loki-config.yaml deploy/
          cp nginx/nginx.conf deploy/nginx/

          cat > deploy/update.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "Pulling latest images..."
          docker compose pull
          echo "Stopping services..."
          docker compose down
          echo "Starting services..."
          docker compose up -d --remove-orphans
          echo "Waiting for services to be healthy..."
          sleep 30
          echo "Service status:"
          docker compose ps
          echo "Checking container logs for errors..."
          docker compose logs --tail=50
          EOF

          chmod +x deploy/update.sh

      - name: Update docker-compose
        run: |
          cd deploy
          VERSION=${{ steps.version.outputs.version }}
          # Convert repository name to lowercase for Docker
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          # Comment out build sections and add image lines
          sed -i 's/^    build:$/    #build:/' docker-compose.yaml
          sed -i 's/^      context:/      #context:/' docker-compose.yaml
          sed -i 's/^      dockerfile:/      #dockerfile:/' docker-compose.yaml
          sed -i 's/^      target:/      #target:/' docker-compose.yaml
          sed -i 's/^      args:$/      #args:/' docker-compose.yaml
          sed -i 's/^        NEXT_PUBLIC/#        NEXT_PUBLIC/' docker-compose.yaml
          # Add image lines for each service
          sed -i '/container_name: swiftlog_ingestor/a\    image: ghcr.io/'"${REPO_LOWER}"'/ingestor:'"${VERSION}" docker-compose.yaml
          sed -i '/container_name: swiftlog_api/a\    image: ghcr.io/'"${REPO_LOWER}"'/api:'"${VERSION}" docker-compose.yaml
          sed -i '/container_name: swiftlog_websocket/a\    image: ghcr.io/'"${REPO_LOWER}"'/websocket:'"${VERSION}" docker-compose.yaml
          sed -i '/container_name: swiftlog_ai_worker/a\    image: ghcr.io/'"${REPO_LOWER}"'/ai-worker:'"${VERSION}" docker-compose.yaml
          sed -i '/container_name: swiftlog_frontend/a\    image: ghcr.io/'"${REPO_LOWER}"'/frontend:'"${VERSION}" docker-compose.yaml
          # Verify the changes
          echo "Modified docker-compose.yaml:"
          grep -A 2 "image: ghcr.io" docker-compose.yaml || true

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy"
          target: "/tmp/"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Required secrets
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # Optional configuration
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          NGINX_PORT: ${{ secrets.NGINX_PORT || '80' }}
          GRPC_PORT: ${{ secrets.GRPC_PORT || '50051' }}
          API_PORT: ${{ secrets.API_PORT || '8080' }}
          WS_PORT: ${{ secrets.WS_PORT || '8081' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'swiftlog' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'swiftlog' }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION || '2h' }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT || 'production' }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'info' }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: POSTGRES_PASSWORD,JWT_SECRET,ENCRYPTION_KEY,ADMIN_PASSWORD,PUBLIC_URL,NGINX_PORT,GRPC_PORT,API_PORT,WS_PORT,POSTGRES_USER,POSTGRES_DB,JWT_EXPIRATION,ADMIN_USERNAME,ENVIRONMENT,LOG_LEVEL,CORS_ORIGINS
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/opt/swiftlog' }}"

            echo "=== Deployment started at $(date) ==="

            # Prepare deployment directory
            sudo mkdir -p $DEPLOY_DIR

            # Copy new files
            sudo cp -r /tmp/deploy/* $DEPLOY_DIR/

            # Set ownership
            sudo chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} $DEPLOY_DIR

            cd $DEPLOY_DIR

            # Validate required secrets
            echo "Validating required environment variables..."
            [ -z "$POSTGRES_PASSWORD" ] && echo "ERROR: POSTGRES_PASSWORD is required" && exit 1
            [ -z "$JWT_SECRET" ] && echo "ERROR: JWT_SECRET is required" && exit 1
            [ -z "$ENCRYPTION_KEY" ] && echo "ERROR: ENCRYPTION_KEY is required" && exit 1
            [ -z "$ADMIN_PASSWORD" ] && echo "ERROR: ADMIN_PASSWORD is required" && exit 1

            # Set CORS_ORIGINS to PUBLIC_URL if not set
            [ -z "$CORS_ORIGINS" ] && [ -n "$PUBLIC_URL" ] && export CORS_ORIGINS="$PUBLIC_URL"

            # Create .env file from environment variables
            echo "Creating .env file from GitHub secrets..."
            cat > .env << ENVEOF
# Database Configuration
POSTGRES_USER=${POSTGRES_USER}
POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
POSTGRES_DB=${POSTGRES_DB}

# Service Ports
NGINX_PORT=${NGINX_PORT}
GRPC_PORT=${GRPC_PORT}
API_PORT=${API_PORT}
WS_PORT=${WS_PORT}

# Security
JWT_SECRET=${JWT_SECRET}
JWT_EXPIRATION=${JWT_EXPIRATION}
ENCRYPTION_KEY=${ENCRYPTION_KEY}

# Admin Account
ADMIN_USERNAME=${ADMIN_USERNAME}
ADMIN_PASSWORD=${ADMIN_PASSWORD}

# Application Configuration
ENVIRONMENT=${ENVIRONMENT}
LOG_LEVEL=${LOG_LEVEL}
CORS_ORIGINS=${CORS_ORIGINS}
PUBLIC_URL=${PUBLIC_URL}
ENVEOF

            echo "✓ Environment file created"

            # Login to GitHub Container Registry
            echo "Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Run update script
            echo "Running update script..."
            ./update.sh

            # Logout from registry
            docker logout ghcr.io

            # Cleanup
            rm -rf /tmp/deploy

            echo "=== Deployment completed at $(date) ==="

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/swiftlog' }}

            echo "=== Running health checks ==="

            # Source .env file to get variables
            set -a
            source .env
            set +a

            # Wait for services to be fully ready
            echo "Waiting 10 seconds for services to stabilize..."
            sleep 10

            # Check docker containers
            echo "Checking container status..."
            docker compose ps

            # Check for unhealthy containers
            UNHEALTHY=$(docker compose ps --format json | jq -r 'select(.Health != "healthy" and .Health != "") | .Name' 2>/dev/null || true)
            if [ -n "$UNHEALTHY" ]; then
              echo "WARNING: Unhealthy containers detected: $UNHEALTHY"
            fi

            # Test nginx endpoint
            echo "Testing nginx health endpoint..."
            if ! curl -f -s -o /dev/null -w "%{http_code}" http://localhost:${NGINX_PORT}/health | grep -q "200"; then
              echo "ERROR: Nginx health check failed"
              docker compose logs nginx
              exit 1
            fi
            echo "✓ Nginx is healthy"

            # Test API endpoint
            echo "Testing API health endpoint..."
            if ! curl -f -s -o /dev/null -w "%{http_code}" http://localhost:${NGINX_PORT}/api/v1/health | grep -q "200"; then
              echo "ERROR: API health check failed"
              docker compose logs api
              exit 1
            fi
            echo "✓ API is healthy"

            echo "=== Health checks passed ==="
            echo "Deployment successful!"

