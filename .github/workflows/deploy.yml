name: Deploy

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Prepare deployment
        run: |
          mkdir -p deploy/nginx
          cp docker-compose.yaml deploy/
          cp loki-config.yaml deploy/
          cp .env.example deploy/.env
          cp nginx/nginx.conf deploy/nginx/

          cat > deploy/update-env.sh << 'EOF'
          #!/bin/bash
          set -e
          ENV_FILE="${1:-.env}"
          update_env() {
            [ -z "$2" ] && return
            if grep -q "^$1=" "$ENV_FILE"; then
              sed -i.bak "s|^$1=.*|$1=$2|" "$ENV_FILE"
            else
              echo "$1=$2" >> "$ENV_FILE"
            fi
          }
          [ -n "$PUBLIC_URL" ] && update_env "PUBLIC_URL" "$PUBLIC_URL"
          [ -n "$NGINX_PORT" ] && update_env "NGINX_PORT" "$NGINX_PORT"
          [ -n "$POSTGRES_PASSWORD" ] && update_env "POSTGRES_PASSWORD" "$POSTGRES_PASSWORD"
          [ -n "$JWT_SECRET" ] && update_env "JWT_SECRET" "$JWT_SECRET"
          [ -n "$ENCRYPTION_KEY" ] && update_env "ENCRYPTION_KEY" "$ENCRYPTION_KEY"
          [ -n "$ADMIN_USERNAME" ] && update_env "ADMIN_USERNAME" "$ADMIN_USERNAME"
          [ -n "$ADMIN_PASSWORD" ] && update_env "ADMIN_PASSWORD" "$ADMIN_PASSWORD"
          [ -n "$ENVIRONMENT" ] && update_env "ENVIRONMENT" "$ENVIRONMENT"
          [ -n "$LOG_LEVEL" ] && update_env "LOG_LEVEL" "$LOG_LEVEL"
          [ -n "$CORS_ORIGINS" ] && update_env "CORS_ORIGINS" "$CORS_ORIGINS"
          rm -f "${ENV_FILE}.bak"
          EOF

          cat > deploy/update.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "Pulling latest images..."
          docker compose pull
          echo "Stopping services..."
          docker compose down
          echo "Starting services..."
          docker compose up -d --remove-orphans
          echo "Waiting for services to be healthy..."
          sleep 30
          echo "Service status:"
          docker compose ps
          echo "Checking container logs for errors..."
          docker compose logs --tail=50
          EOF

          chmod +x deploy/*.sh

      - name: Update docker-compose
        run: |
          cd deploy
          VERSION=${{ steps.version.outputs.version }}
          # Convert repository name to lowercase for Docker
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          # Comment out build sections and add image lines
          sed -i 's/^    build:$/    #build:/' docker-compose.yaml
          sed -i 's/^      context:/      #context:/' docker-compose.yaml
          sed -i 's/^      dockerfile:/      #dockerfile:/' docker-compose.yaml
          sed -i 's/^      target:/      #target:/' docker-compose.yaml
          sed -i 's/^      args:$/      #args:/' docker-compose.yaml
          sed -i 's/^        NEXT_PUBLIC/#        NEXT_PUBLIC/' docker-compose.yaml
          # Add image lines for each service
          sed -i '/container_name: swiftlog_ingestor/a\    image: ghcr.io/'"${REPO_LOWER}"'/ingestor:'"${VERSION}" docker-compose.yaml
          sed -i '/container_name: swiftlog_api/a\    image: ghcr.io/'"${REPO_LOWER}"'/api:'"${VERSION}" docker-compose.yaml
          sed -i '/container_name: swiftlog_websocket/a\    image: ghcr.io/'"${REPO_LOWER}"'/websocket:'"${VERSION}" docker-compose.yaml
          sed -i '/container_name: swiftlog_ai_worker/a\    image: ghcr.io/'"${REPO_LOWER}"'/ai-worker:'"${VERSION}" docker-compose.yaml
          sed -i '/container_name: swiftlog_frontend/a\    image: ghcr.io/'"${REPO_LOWER}"'/frontend:'"${VERSION}" docker-compose.yaml
          # Verify the changes
          echo "Modified docker-compose.yaml:"
          grep -A 2 "image: ghcr.io" docker-compose.yaml || true

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy"
          target: "/tmp/"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          NGINX_PORT: ${{ secrets.NGINX_PORT || '80' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ENVIRONMENT: production
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'info' }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: PUBLIC_URL,NGINX_PORT,POSTGRES_PASSWORD,JWT_SECRET,ENCRYPTION_KEY,ADMIN_USERNAME,ADMIN_PASSWORD,ENVIRONMENT,LOG_LEVEL,CORS_ORIGINS
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/opt/swiftlog' }}"

            echo "=== Deployment started at $(date) ==="

            # Prepare deployment directory
            sudo mkdir -p $DEPLOY_DIR

            # Backup current .env if exists
            [ -f $DEPLOY_DIR/.env ] && sudo cp $DEPLOY_DIR/.env /tmp/.env.backup

            # Copy new files
            sudo cp -r /tmp/deploy/* $DEPLOY_DIR/

            # Restore .env or use new one
            [ -f /tmp/.env.backup ] && sudo cp /tmp/.env.backup $DEPLOY_DIR/.env || sudo cp /tmp/deploy/.env $DEPLOY_DIR/.env

            # Set ownership
            sudo chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} $DEPLOY_DIR

            cd $DEPLOY_DIR

            # Update environment variables
            export PUBLIC_URL NGINX_PORT POSTGRES_PASSWORD JWT_SECRET ENCRYPTION_KEY ADMIN_USERNAME ADMIN_PASSWORD ENVIRONMENT LOG_LEVEL CORS_ORIGINS
            ./update-env.sh .env

            # Validate required secrets
            echo "Validating required environment variables..."
            [ -z "$POSTGRES_PASSWORD" ] && echo "ERROR: POSTGRES_PASSWORD is required" && exit 1
            [ -z "$JWT_SECRET" ] && echo "ERROR: JWT_SECRET is required" && exit 1
            [ -z "$ENCRYPTION_KEY" ] && echo "ERROR: ENCRYPTION_KEY is required" && exit 1

            # Set CORS_ORIGINS to PUBLIC_URL if not set
            [ -z "$CORS_ORIGINS" ] && [ -n "$PUBLIC_URL" ] && export CORS_ORIGINS="$PUBLIC_URL" && ./update-env.sh .env

            # Login to GitHub Container Registry
            echo "Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Run update script
            echo "Running update script..."
            ./update.sh

            # Logout from registry
            docker logout ghcr.io

            # Cleanup
            rm -rf /tmp/deploy /tmp/.env.backup

            echo "=== Deployment completed at $(date) ==="

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/swiftlog' }}

            echo "=== Running health checks ==="

            # Get nginx port from .env
            NGINX_PORT=$(grep -E '^NGINX_PORT=' .env | cut -d'=' -f2 || echo "80")

            # Wait for services to be fully ready
            echo "Waiting 10 seconds for services to stabilize..."
            sleep 10

            # Check docker containers
            echo "Checking container status..."
            docker compose ps

            # Check for unhealthy containers
            UNHEALTHY=$(docker compose ps --format json | jq -r 'select(.Health != "healthy" and .Health != "") | .Name' 2>/dev/null || true)
            if [ -n "$UNHEALTHY" ]; then
              echo "WARNING: Unhealthy containers detected: $UNHEALTHY"
            fi

            # Test nginx endpoint
            echo "Testing nginx health endpoint..."
            if ! curl -f -s -o /dev/null -w "%{http_code}" http://localhost:${NGINX_PORT}/health | grep -q "200"; then
              echo "ERROR: Nginx health check failed"
              docker compose logs nginx
              exit 1
            fi
            echo "✓ Nginx is healthy"

            # Test API endpoint
            echo "Testing API health endpoint..."
            if ! curl -f -s -o /dev/null -w "%{http_code}" http://localhost:${NGINX_PORT}/api/v1/health | grep -q "200"; then
              echo "ERROR: API health check failed"
              docker compose logs api
              exit 1
            fi
            echo "✓ API is healthy"

            echo "=== Health checks passed ==="
            echo "Deployment successful!"

