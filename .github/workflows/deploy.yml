name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image version to deploy (e.g., 0.1.0, latest)"
        required: true
        default: "latest"
        type: string
      environment:
        description: "Deployment environment"
        type: choice
        options: [production, staging]
        default: production
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT

      - name: Prepare deployment
        run: |
          mkdir -p deploy/nginx
          mkdir -p deploy/backend/migrations
          cp docker-compose.yaml deploy/
          cp loki-config.yaml deploy/
          cp nginx/nginx.conf deploy/nginx/
          cp backend/migrations/*.sql deploy/backend/migrations/

          cat > deploy/update.sh << 'EOF'
          #!/bin/bash
          set -e

          # Load environment variables from .env file
          echo "Loading environment variables from .env..."
          set -a
          source .env
          set +a

          echo "Pulling latest images..."
          docker compose pull
          echo "Stopping services..."
          docker compose down
          echo "Starting services..."
          docker compose up -d --remove-orphans
          echo "Waiting for services to be healthy..."
          sleep 30
          echo "Service status:"
          docker compose ps

          # Run database migrations
          echo "Running database migrations..."
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" > /dev/null 2>&1; then
              echo "✓ PostgreSQL is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "ERROR: PostgreSQL failed to become ready"
              exit 1
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

          # Apply migrations in order
          for migration_file in backend/migrations/*.sql; do
            if [ -f "$migration_file" ]; then
              echo "Applying migration: $(basename $migration_file)"
              cat "$migration_file" | docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" 2>&1 | tee /tmp/migration.log
              if grep -qi "error" /tmp/migration.log; then
                echo "⚠ Warning in migration: $(basename $migration_file)"
                cat /tmp/migration.log
              else
                echo "✓ Migration applied: $(basename $migration_file)"
              fi
            fi
          done
          echo "✓ Database migrations completed"

          echo "Checking container logs for errors..."
          docker compose logs --tail=50
          EOF

          chmod +x deploy/update.sh

      - name: Update docker-compose
        run: |
          cd deploy
          VERSION=${{ steps.version.outputs.version }}
          # Convert repository name to lowercase for Docker
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          # Comment out build sections and add image lines
          sed -i 's/^    build:$/    #build:/' docker-compose.yaml
          sed -i 's/^      context:/      #context:/' docker-compose.yaml
          sed -i 's/^      dockerfile:/      #dockerfile:/' docker-compose.yaml
          sed -i 's/^      target:/      #target:/' docker-compose.yaml
          sed -i 's/^      args:$/      #args:/' docker-compose.yaml
          sed -i 's/^        NEXT_PUBLIC/#        NEXT_PUBLIC/' docker-compose.yaml
          # Add image lines for each service
          sed -i '/container_name: swiftlog_ingestor/a\    image: ghcr.io/'"${REPO_LOWER}"'/ingestor:'"${VERSION}" docker-compose.yaml
          sed -i '/container_name: swiftlog_api/a\    image: ghcr.io/'"${REPO_LOWER}"'/api:'"${VERSION}" docker-compose.yaml
          sed -i '/container_name: swiftlog_websocket/a\    image: ghcr.io/'"${REPO_LOWER}"'/websocket:'"${VERSION}" docker-compose.yaml
          sed -i '/container_name: swiftlog_ai_worker/a\    image: ghcr.io/'"${REPO_LOWER}"'/ai-worker:'"${VERSION}" docker-compose.yaml
          sed -i '/container_name: swiftlog_frontend/a\    image: ghcr.io/'"${REPO_LOWER}"'/frontend:'"${VERSION}" docker-compose.yaml
          # Verify the changes
          echo "Modified docker-compose.yaml:"
          grep -A 2 "image: ghcr.io" docker-compose.yaml || true

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy"
          target: "/tmp/"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Required secrets
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # Optional configuration
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          NGINX_PORT: ${{ secrets.NGINX_PORT || '80' }}
          GRPC_PORT: ${{ secrets.GRPC_PORT || '50051' }}
          API_PORT: ${{ secrets.API_PORT || '8080' }}
          WS_PORT: ${{ secrets.WS_PORT || '8081' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'swiftlog' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'swiftlog' }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION || '2h' }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT || 'production' }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'info' }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: POSTGRES_PASSWORD,JWT_SECRET,ENCRYPTION_KEY,ADMIN_PASSWORD,PUBLIC_URL,NGINX_PORT,GRPC_PORT,API_PORT,WS_PORT,POSTGRES_USER,POSTGRES_DB,JWT_EXPIRATION,ADMIN_USERNAME,ENVIRONMENT,LOG_LEVEL,CORS_ORIGINS
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/opt/swiftlog' }}"

            echo "=== Deployment started at $(date) ==="

            # Prepare deployment directory
            sudo mkdir -p $DEPLOY_DIR

            # Copy new files
            sudo cp -r /tmp/deploy/* $DEPLOY_DIR/

            # Set ownership
            sudo chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} $DEPLOY_DIR

            cd $DEPLOY_DIR

            # Validate required secrets
            echo "Validating required environment variables..."
            [ -z "$POSTGRES_PASSWORD" ] && echo "ERROR: POSTGRES_PASSWORD is required" && exit 1
            [ -z "$JWT_SECRET" ] && echo "ERROR: JWT_SECRET is required" && exit 1
            [ -z "$ENCRYPTION_KEY" ] && echo "ERROR: ENCRYPTION_KEY is required" && exit 1
            [ -z "$ADMIN_PASSWORD" ] && echo "ERROR: ADMIN_PASSWORD is required" && exit 1

            # Set CORS_ORIGINS to PUBLIC_URL if not set, or use a safe default
            if [ -z "$CORS_ORIGINS" ]; then
              if [ -n "$PUBLIC_URL" ]; then
                export CORS_ORIGINS="$PUBLIC_URL"
              else
                # Default to allowing requests from the same host
                export CORS_ORIGINS="http://localhost,http://127.0.0.1"
                echo "WARNING: CORS_ORIGINS not set and PUBLIC_URL is empty. Using default: $CORS_ORIGINS"
              fi
            fi

            # Create .env file from environment variables
            echo "Creating .env file from GitHub secrets..."
            {
              echo "# Database Configuration"
              echo "POSTGRES_USER=$POSTGRES_USER"
              echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
              echo "POSTGRES_DB=$POSTGRES_DB"
              echo ""
              echo "# Service Ports"
              echo "NGINX_PORT=$NGINX_PORT"
              echo "GRPC_PORT=$GRPC_PORT"
              echo "API_PORT=$API_PORT"
              echo "WS_PORT=$WS_PORT"
              echo ""
              echo "# Security"
              echo "JWT_SECRET=$JWT_SECRET"
              echo "JWT_EXPIRATION=$JWT_EXPIRATION"
              echo "ENCRYPTION_KEY=$ENCRYPTION_KEY"
              echo ""
              echo "# Admin Account"
              echo "ADMIN_USERNAME=$ADMIN_USERNAME"
              echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
              echo ""
              echo "# Application Configuration"
              echo "ENVIRONMENT=$ENVIRONMENT"
              echo "LOG_LEVEL=$LOG_LEVEL"
              echo "CORS_ORIGINS=$CORS_ORIGINS"
              echo "PUBLIC_URL=$PUBLIC_URL"
            } > .env

            echo "✓ Environment file created"

            # Login to GitHub Container Registry
            echo "Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Run update script
            echo "Running update script..."
            ./update.sh

            # Logout from registry
            docker logout ghcr.io

            # Cleanup
            rm -rf /tmp/deploy

            echo "=== Deployment completed at $(date) ==="

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/swiftlog' }}

            echo "=== Running health checks ==="

            # Source .env file to get variables
            set -a
            source .env
            set +a

            # Wait for services to be fully ready
            echo "Waiting 10 seconds for services to stabilize..."
            sleep 10

            # Check docker containers
            echo "Checking container status..."
            docker compose ps

            # Check for unhealthy containers
            UNHEALTHY=$(docker compose ps --format json | jq -r 'select(.Health != "healthy" and .Health != "") | .Name' 2>/dev/null || true)
            if [ -n "$UNHEALTHY" ]; then
              echo "WARNING: Unhealthy containers detected: $UNHEALTHY"
            fi


            # Test health endpoint (nginx -> api)
            echo "Testing health endpoint (nginx -> api)..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${NGINX_PORT}/health)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Health check passed (HTTP $HTTP_CODE)"
            else
              echo "ERROR: Health check failed (HTTP $HTTP_CODE)"
              echo "=== Nginx logs ==="
              docker compose logs --tail=20 nginx
              echo "=== API logs ==="
              docker compose logs --tail=20 api
              exit 1
            fi

            # Test frontend accessibility
            echo "Testing frontend endpoint..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${NGINX_PORT}/)
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ]; then
              echo "✓ Frontend is accessible (HTTP $HTTP_CODE)"
            else
              echo "WARNING: Frontend check returned HTTP $HTTP_CODE"
              docker compose logs --tail=20 frontend
            fi

            echo "=== Health checks passed ==="
            echo "Deployment successful!"
