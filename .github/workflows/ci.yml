name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: backend/go.sum
      - working-directory: ./backend
        run: |
          go mod download
          gofmt -s -l . | grep . && exit 1 || true
          go vet ./...
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

  cli-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: cli/go.sum
      - working-directory: ./cli
        run: go build -v .

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npm run type-check || npx tsc --noEmit
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    strategy:
      matrix:
        service:
          - {name: api, context: backend, dockerfile: Dockerfile}
          - {name: ingestor, context: backend, dockerfile: Dockerfile}
          - {name: websocket, context: backend, dockerfile: Dockerfile}
          - {name: ai-worker, context: backend, dockerfile: Dockerfile}
          - {name: frontend, context: frontend, dockerfile: Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.context }}
          file: ./${{ matrix.service.context }}/${{ matrix.service.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp .env.example .env
          sed -i 's/POSTGRES_PASSWORD=changeme/POSTGRES_PASSWORD=testpass/' .env
          docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d
          sleep 30
          curl -f http://localhost:8080/health || exit 1
          curl -f http://localhost/health || exit 1
      - if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml down -v
