title: SwiftLog Documentation
description: A lightweight, high-performance platform for collecting, storing, and analyzing logs from script executions.
theme: just-the-docs

url: https://aliancn.github.io
baseurl: /swiftlog

# Logo (optional - add if you have a logo)
# logo: "/assets/images/logo.png"

# Aux links for the upper right navigation
aux_links:
  "SwiftLog on GitHub":
    - "https://github.com/aliancn/swiftlog"
  "View Releases":
    - "https://github.com/aliancn/swiftlog/releases"

# Makes aux links open in a new tab
aux_links_new_tab: true

# Footer content
footer_content: "Copyright &copy; 2025 SwiftLog. Built with <a href=\"https://github.com/just-the-docs/just-the-docs\">Just the Docs</a>."

# Color scheme (light or dark)
color_scheme: light

# Enable search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Heading anchors
heading_anchors: true

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Enable copy code button
enable_copy_code_button: true

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Compress HTML
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap